[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-trust-lab-analyzer"
dynamic = ["version"]
description = "Analyzer for Android Trust Lab trust-state reports"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Aleksander Vlasov"}]
license = {text = "Apache-2.0"}
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage>=7.0",
    "packaging>=23.0",
    "pytest>=7.0",
    "PyYAML>=6.0",
    "setuptools>=68",
    "tomli>=2.0; python_version < '3.11'",
    "wheel>=0.41",
]
rich = ["rich>=13.0"]

[project.urls]
Repository = "https://github.com/avlasov-co/android-trust-lab"

[project.scripts]
trustlab = "trustlab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trustlab*"]

[tool.setuptools.package-data]
trustlab = ["schemas/*.json"]

[tool.setuptools.dynamic]
version = {attr = "trustlab._version.__version__"}
