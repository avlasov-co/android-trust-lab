[tool.ruff]
target-version = "py311"
line-length = 88
src = ["analyzer", "tools", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# This standalone generator bootstraps the adjacent analyzer package before import.
"tools/generate_report.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["analyzer/trustlab", "tools"]
mypy_path = "analyzer"
strict = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = ["-q", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["analyzer"]

[tool.coverage.run]
branch = true
source = ["analyzer/trustlab"]

[tool.coverage.report]
show_missing = true
skip_empty = true
