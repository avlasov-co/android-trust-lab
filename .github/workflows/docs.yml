name: Docs

on:
  push:
  pull_request:

jobs:
  required-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/trust_model.md
          test -f docs/emulator_limitations.md
          test -f docs/duckdetector_comparison.md
          test -f docs/paper.md
          test -f docs/reviewer_quickstart.md
          test -f docs/dataset_manifest_v2.md
          test -f docs/content_identity.md
          test -f docs/report_schema_v3.md
          test -f collector/schema/trust_report_v1_0_0.schema.json
          test -f collector/schema/trust_report_v2_0_0.schema.json
          test -f collector/schema/trust_report_v3_0_0.schema.json
          test -f collector/schema/collection_manifest_v1_0_0.schema.json
          test -f collector/schema/dataset_manifest_v1_0_0.schema.json
          test -f collector/schema/dataset_manifest_v2_0_0.schema.json
          test -f collector/schema/dataset_source_v1_0_0.schema.json
          test -f collector/schema/trust_diff.schema.json
          test -f collector/schema/trust_diff_v2_0_0.schema.json
