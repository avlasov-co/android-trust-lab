name: Android

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37'
      - name: Compile, unit test, lint, and verify merged manifest
        working-directory: app
        run: >-
          ./gradlew --dependency-verification strict
          :observer:assembleDebug
          :observer:assembleRelease
          :observer:assembleDebugAndroidTest
          :observer:testDebugUnitTest
          :observer:lint
          :observer:verifyDebugMergedManifest
          :observer:verifyReleaseMergedManifest

  managed-device-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install API 35 managed-device image
        run: sdkmanager 'platforms;android-37' 'system-images;android-35;default;x86_64'
      - name: Run PR managed-device smoke test
        working-directory: app
        run: >-
          ./gradlew --dependency-verification strict
          :observer:pixel2Api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: managed-device-smoke-results
          path: app/observer/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore

  managed-device-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '27'
            task: pixel2Api27DebugAndroidTest
          - api: '30'
            task: pixel2Api30DebugAndroidTest
          - api: '35'
            task: pixel2Api35DebugAndroidTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install managed-device image
        run: >-
          sdkmanager 'platforms;android-37'
          'system-images;android-${{ matrix.api }};default;x86_64'
      - name: Run scheduled managed-device contract matrix
        working-directory: app
        run: >-
          ./gradlew --dependency-verification strict
          :observer:${{ matrix.task }}
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: managed-device-api-${{ matrix.api }}-results
          path: app/observer/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
